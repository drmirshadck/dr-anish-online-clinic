# One helper per CLINIC (Pro). Change name, vars and the KV id for each client.
name = "homoeocare-helper"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[triggers]
crons = ["*/15 * * * *"]   # WhatsApp reminders (24 h + 1 h) and review requests

[vars]
CLINIC_NAME = "Homoeocare Multi Speciality Clinic"
CLINIC_WHATSAPP = "917559882838"        # clinic's own WhatsApp, shown to patients for questions
DESK_WHATSAPP = "917559882838"          # front desk gets "new booking" WhatsApp alerts ("" = none)
REVIEW_URL = ""                         # clinic's Google review link ("" = no review requests)
SITE_URL = "https://homoeocareonline.com"
ALLOWED_ORIGINS = "https://homoeocareonline.com,https://www.homoeocareonline.com,https://drmirshadck.github.io"
VAPID_SUBJECT = "mailto:support@arshees.com"
WA_ENABLED = "0"                        # WhatsApp off for now (tap-to-send still works)
WA_LANG = "en"
WA_PHONE_ID = "1442684148932294"        # DotCom WhatsApp sender (Meta test number for now)
# One entry per doctor. types: calSlug -> name, fee, kind (new/review). whatsapp: doctor's alerts number.
DOCTORS_JSON = '''[{"id":"anish","name":"Dr. Anish Mohan","whatsapp":"917559882838","roomUrl":"https://dranishmohan.daily.co/consult","types":{"online-video-consultation":{"name":"New consultation","fee":500,"kind":"new"},"review-consultation":{"name":"Review consultation","fee":300,"kind":"review"},"clinic-visit":{"name":"Clinic visit","fee":0,"kind":"new"}}},{"id":"sarigha","name":"Dr. Sariga Sivan","whatsapp":"917559882838","roomUrl":"","types":{"online-video-consultation":{"name":"New consultation","fee":500,"kind":"new"},"review-consultation":{"name":"Review consultation","fee":300,"kind":"review"},"clinic-visit":{"name":"Clinic visit","fee":0,"kind":"new"}}}]'''

[[kv_namespaces]]
binding = "PUSH"
id = "bfd5e23142a34755b8a1bd7e1b693267"

# Secrets (never in this file): CAL_KEYS, DAILY_KEYS, PINS, SESSION_SECRET, CAL_WEBHOOK_SECRET,
# VAPID_PUBLIC_KEY, VAPID_PRIVATE_JWK, WA_TOKEN   ->  node make-secrets.mjs sample=1234 desk=5678
